## Settings file was created by plugin LeadMeOut v1.0.1
## Plugin GUID: LeadMeOut

[Behavior]

## LinearMode shows navigational path lines on the floor.
## CompassMode overlays directional markers on the HUD compass.
## Line Style options only affect Linear Mode and do not affect Compass Mode.
# Setting type: NavigationMode
# Default value: LinearMode
# Acceptable values: LinearMode, CompassMode
NavigationMode = CompassMode

## Choose which exit lines to show.
# Setting type: ShowLinesPreset
# Default value: ShowBoth
# Acceptable values: ShowBoth, MainEntranceOnly, FireExitsOnly
ShowLines = ShowBoth

## How far ahead the path line renders. Short=15, Medium=30, Long=50, Full=unlimited.
# Setting type: RenderDistancePreset
# Default value: Medium
# Acceptable values: Short, Medium, Long, Full
RenderDistance = Medium

## Automatically show lines when entering a facility. Hotkey toggles navigation off/on.
# Setting type: Boolean
# Default value: false
AutoEnableOnEntry = true

## Brightness of exit markers (lines and compass pips). Enter a value between 20 and 100.
# Setting type: Int32
# Default value: 80
# Acceptable value range: From 20 to 100
Brightness = 80

[Fire Exit]

## Line style for the fire exit path.
## Style options do not affect Compass mode.
# Setting type: LineStyle
# Default value: Solid
# Acceptable values: Solid, Dashed, Dotted, Arrow, Triangle, Diamond, Heart, Pawprint
LineStyle = Solid

## Line width for the fire exit path.
# Setting type: LineWidthPreset
# Default value: Standard
# Acceptable values: Hairline, Thin, Standard, Heavy, Thiccc
LineWidth = Standard

## Color of the fire exit line.
# Setting type: LineColorPreset
# Default value: Red
# Acceptable values: Green, Red, Cyan, Magenta, Yellow, White, Blue, Orange, Purple, Black, Custom
Color = Red

## Custom hex color for fire exit. Only used when Color is set to Custom.
# Setting type: String
# Default value: #FF0000
CustomHex = #FF0000

[Main Entrance]

## Line style for the main entrance path.
## Style options do not affect Compass mode.
# Setting type: LineStyle
# Default value: Solid
# Acceptable values: Solid, Dashed, Dotted, Arrow, Triangle, Diamond, Heart, Pawprint
LineStyle = Solid

## Line width for the main entrance path.
# Setting type: LineWidthPreset
# Default value: Standard
# Acceptable values: Hairline, Thin, Standard, Heavy, Thiccc
LineWidth = Standard

## Color of the main entrance line.
# Setting type: LineColorPreset
# Default value: Green
# Acceptable values: Green, Red, Cyan, Magenta, Yellow, White, Blue, Orange, Purple, Black, Custom
Color = Green

## Custom hex color for main entrance. Only used when Color is set to Custom.
# Setting type: String
# Default value: #00FF00
CustomHex = #00FF00

